name: Build NXT-OS Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish WPF
        shell: pwsh
        run: dotnet publish src/NXT.Desktop/NXT.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc installer\NXT-OS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path dist\NXT-OS-Setup.exe)) { throw "Installer output missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: NXT-OS-Windows-Installer
          path: dist/NXT-OS-Setup.exe
          if-no-files-found: error
